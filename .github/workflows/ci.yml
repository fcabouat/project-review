name: Verify and publish
# Read-only validation; browser/site checks run on pushes and manual runs.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run check
      - run: pnpm run knip
      - run: pnpm run test:coverage
      - run: pnpm run build
      - if: github.event_name != 'pull_request'
        run: pnpm exec playwright install --with-deps chromium
      - if: github.event_name != 'pull_request'
        run: pnpm run smoke
      - if: github.event_name != 'pull_request'
        run: pnpm run docs:api
      - if: github.event_name != 'pull_request'
        run: pnpm run build-storybook
      - if: github.event_name != 'pull_request'
        run: pnpm run docs:site
      - if: github.event_name != 'pull_request'
        run: pnpm run a11y
      - run: pnpm audit
        continue-on-error: true # advisories inform, they do not gate
      - if: >-
          vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }

  bun-compat:
    # Secondary local workflow: checked on demand, never a release gate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - run: bun install --linker hoisted --no-save
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: git diff --exit-code

  deploy:
    needs: verify
    if: >-
      vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      queue: max
      cancel-in-progress: false
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # No checkout or repository code beside deployment credentials.
    steps:
      - name: refuse to publish a commit main has moved past
        id: freshness
        run: |
          set -euo pipefail
          current=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          [ -n "$current" ] || { echo "could not read refs/heads/main from the remote"; exit 1; }
          if [ "$current" != "${{ github.sha }}" ]; then
            echo "main has moved past this run — skipping deploy"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - id: deploy
        if: steps.freshness.outputs.stale != 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
