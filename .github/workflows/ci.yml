name: Verify and publish
on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  codeql:
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    permissions: { contents: read, security-events: write }
    uses: ./.github/workflows/codeql.yml

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce Gitflow PR destinations
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const {checkGitflow} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/gitflow.mjs`);
            await checkGitflow({github, context});
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run check
      - run: pnpm run knip
      - run: pnpm run test:coverage
      - run: pnpm run build
      - if: github.event_name != 'pull_request'
        run: pnpm exec playwright install --with-deps chromium
      - if: github.event_name != 'pull_request'
        run: pnpm run smoke
      - if: github.event_name != 'pull_request'
        run: pnpm run docs:api
      - if: github.event_name != 'pull_request'
        run: pnpm run build-storybook
      - if: github.event_name != 'pull_request'
        run: pnpm run docs:examples
      - if: github.event_name != 'pull_request'
        run: pnpm run docs:site
      - if: github.event_name != 'pull_request'
        run: pnpm run a11y
      - run: pnpm audit
        continue-on-error: true
      - name: Validate the release tag against main and all package versions
        if: startsWith(github.ref, 'refs/tags/v')
        env: { RELEASE_TAG: '${{ github.ref_name }}' }
        run: node scripts/version.mjs validate-tag "$RELEASE_TAG"
      - name: Preserve release assets for the publication job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            dist/project-review.html
            dist/THIRD-PARTY-LICENSES.txt
            dist/sample-portfolio.en.json
            dist/sample-portfolio.fr.json
      - if: >-
          vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }

  bun-compat:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: '1.4.0' }
      - run: bun install --linker hoisted --no-save
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: git diff --exit-code

  deploy:
    needs: verify
    if: >-
      vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      queue: max
      cancel-in-progress: false
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Refuse to deploy a commit main has moved past
        id: freshness
        run: |
          set -euo pipefail
          current=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          [ -n "$current" ] || { echo "could not read refs/heads/main from the remote"; exit 1; }
          if [ "$current" != "${{ github.sha }}" ]; then
            echo "main has moved past this run — skipping deploy"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - id: deploy
        if: steps.freshness.outputs.stale != 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    needs: [verify, codeql]
    if: >-
      always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      needs.verify.result == 'success' &&
      (needs.codeql.result == 'success' || github.event.repository.private == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Create or resume the GitHub release
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env: { RELEASE_TAG: '${{ github.ref_name }}' }
        with:
          script: |
            const repo = context.repo;
            const tag = process.env.RELEASE_TAG;
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({...repo, tag})).data; }
            catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({...repo, tag_name: tag,
                target_commitish: context.sha, name: `Project Review ${tag}`,
                ...(tag === 'v0.1.0' ? {body: 'Initial public release.'} : {generate_release_notes: true}),
                draft: false, prerelease: false})).data;
            }
            if (release.draft || release.prerelease) throw new Error('Existing release is draft or prerelease');
            const expected = ['project-review.html', 'THIRD-PARTY-LICENSES.txt',
              'sample-portfolio.en.json', 'sample-portfolio.fr.json'];
            const existing = new Set(release.assets.map(asset => asset.name));
            core.setOutput('missing', expected.filter(name => !existing.has(name)).join(' '));
      - name: Upload only missing release assets
        if: steps.release.outputs.missing != ''
        env:
          GH_TOKEN: '${{ github.token }}'
          GH_REPO: '${{ github.repository }}'
          RELEASE_TAG: '${{ github.ref_name }}'
          MISSING_ASSETS: '${{ steps.release.outputs.missing }}'
        run: |
          set -euo pipefail
          for asset in $MISSING_ASSETS; do
            gh release upload "$RELEASE_TAG" "release-assets/$asset"
          done
