name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run check
      - run: bun run test
      - run: bun run build
      # file:// smoke on the deliverable the build just produced (precondition
      # of `bun run smoke`: an up-to-date app/dist/).
      - run: npx playwright install --with-deps chromium
      - run: bun run smoke
      - run: bun audit
        continue-on-error: true # advisories inform, they do not gate
