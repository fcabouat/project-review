name: CI
# Actions pinned to a full commit SHA (tag in the comment): a tag is a mutable
# pointer, and this workflow runs on every push and every pull request.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run check
      # Coverage, not just the suite: the thresholds in vitest.config.ts (lines
      # at 100 % on every package) only apply when coverage is MEASURED — run
      # without it they gate nothing, and the README's claim would rest on a
      # local habit rather than on CI.
      - run: bun run test:coverage
      - run: bun run build
      # The full ceremony — browser install + file:// smoke + axe pass on the
      # freshly built deliverables — runs on milestone branches only; pull
      # requests keep the fast lane (lint/format/check/test/build).
      - if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium
      - if: github.event_name != 'pull_request'
        run: bun run smoke
      # `docs:site` ASSEMBLES the site out of artifacts other scripts build; it
      # generates none of them, and the two below are gitignored — so on a
      # fresh checkout they must be built HERE, or the assembly fails and the
      # a11y pass behind it is never reached.
      - if: github.event_name != 'pull_request'
        run: bun run docs:api
      - if: github.event_name != 'pull_request'
        run: bun run build-storybook
      - if: github.event_name != 'pull_request'
        run: bun run docs:site
      - if: github.event_name != 'pull_request'
        run: bun run a11y
      - run: bun audit
        continue-on-error: true # advisories inform, they do not gate
