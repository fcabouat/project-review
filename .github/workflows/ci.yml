name: Verify and publish
# Read-only validation; browser/site checks run on pushes and manual runs.
on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Prepare a release PR from verified develop with Changesets
        type: boolean
        default: false
permissions: { contents: read }
jobs:
  codeql:
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    permissions: { contents: read, security-events: write }
    uses: ./.github/workflows/codeql.yml

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce Gitflow PR destinations and release provenance
        id: gitflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const {checkGitflow} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/gitflow.mjs`);
            await checkGitflow({github, context, core});
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run check
      - name: Require a Changesets decision on feature PRs
        if: steps.gitflow.outputs.changeset-required == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm changeset status --since "$BASE_SHA"
      - run: pnpm run knip
      - run: pnpm run test:coverage
      - run: pnpm run build
      - if: github.event_name != 'pull_request'
        run: pnpm exec playwright install --with-deps chromium
      - if: github.event_name != 'pull_request'
        run: pnpm run smoke
      - if: github.event_name != 'pull_request'
        run: pnpm run docs:api
      - if: github.event_name != 'pull_request'
        run: pnpm run build-storybook
      - if: github.event_name != 'pull_request'
        run: pnpm run docs:examples
      - if: github.event_name != 'pull_request'
        run: pnpm run docs:site
      - if: github.event_name != 'pull_request'
        run: pnpm run a11y
      - run: pnpm audit
        continue-on-error: true # advisories inform, they do not gate
      - if: >-
          vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: _site }

  bun-compat:
    # Secondary local workflow: checked on demand, never a release gate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false # This job uses Bun, not the declared pnpm manager.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - run: bun install --linker hoisted --no-save
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: git diff --exit-code

  deploy:
    needs: verify
    if: >-
      vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      queue: max
      cancel-in-progress: false
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # No checkout or repository code beside deployment credentials.
    steps:
      - name: refuse to publish a commit main has moved past
        id: freshness
        run: |
          set -euo pipefail
          current=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          [ -n "$current" ] || { echo "could not read refs/heads/main from the remote"; exit 1; }
          if [ "$current" != "${{ github.sha }}" ]; then
            echo "main has moved past this run — skipping deploy"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - id: deploy
        if: steps.freshness.outputs.stale != 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  release:
    needs: [verify, codeql]
    # Publishing the software is independent of its optional Pages deployment.
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      needs.verify.result == 'success' &&
      (needs.codeql.result == 'success' || github.event.repository.private == true) &&
      ((github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch' && inputs.prepare_release == true) ||
       github.ref == 'refs/heads/main')
    permissions: { contents: write, pull-requests: write }
    uses: ./.github/workflows/release.yml

  publication-summary:
    needs: [verify, codeql, deploy, release]
    if: >-
      always() && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'workflow_dispatch' && inputs.prepare_release == true))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report each publication stage
        env:
          VERIFY: ${{ needs.verify.result }}
          CODEQL: ${{ needs.codeql.result }}
          PAGES: ${{ needs.deploy.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          {
            echo '## Publication outcomes'
            echo "- Verification: $VERIFY"
            echo "- CodeQL: $CODEQL"
            echo "- Pages: $PAGES"
            echo "- Release preparation or publication: $RELEASE"
            echo 'A green verification alone does not mean publication is complete.'
            echo 'On develop, preparation opens a PR only if pending changesets exist and no delivery is active.'
            echo 'On main, verification and CodeQL gate the release; Pages is independent.'
            echo 'A published release does not mean the site is up to date: check the Pages result separately.'
            echo 'Inspect the release job for the PR or release URL, or the reason no action was taken.'
          } >> "$GITHUB_STEP_SUMMARY"
