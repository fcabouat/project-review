name: CI
# Actions pinned to a full commit SHA (tag in the comment): a tag is a mutable
# pointer, and this workflow runs on every push and every pull request.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
# The MINIMUM, declared rather than inherited. Without this key the job takes
# the repository's default token scopes — which can be write — and every step
# below runs third-party code: `bun install` executes the lockfile's install
# scripts, the linters and the browser run the head commit. None of it needs to
# write anything back, and what publishes already says so (pages.yml).
permissions: { contents: read }
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # `persist-credentials: false`: nothing after the checkout has any
      # business finding a token in .git/config — the same rule the publication
      # workflow states, for the same reason.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run check
      # The README lists `bun run knip` among the checks this project runs; a
      # check nothing executes is a claim, not a control. It costs seconds and
      # it catches what the type checker cannot: a file, an export or a
      # dependency nobody reaches any more.
      - run: bun run knip
      # Coverage, not just the suite: the thresholds in vitest.config.ts (lines
      # at 100 % on every package) only apply when coverage is MEASURED — run
      # without it they gate nothing, and the README's claim would rest on a
      # local habit rather than on CI.
      - run: bun run test:coverage
      - run: bun run build
      # The full ceremony — browser install + file:// smoke + axe pass on the
      # freshly built deliverables — runs on milestone branches only; pull
      # requests keep the fast lane (lint/format/check/test/build).
      - if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium
      - if: github.event_name != 'pull_request'
        run: bun run smoke
      # `docs:site` ASSEMBLES the site out of artifacts other scripts build; it
      # generates none of them, and the two below are gitignored — so on a
      # fresh checkout they must be built HERE, or the assembly fails and the
      # a11y pass behind it is never reached.
      - if: github.event_name != 'pull_request'
        run: bun run docs:api
      - if: github.event_name != 'pull_request'
        run: bun run build-storybook
      - if: github.event_name != 'pull_request'
        run: bun run docs:site
      - if: github.event_name != 'pull_request'
        run: bun run a11y
      - run: bun audit
        continue-on-error: true # advisories inform, they do not gate
