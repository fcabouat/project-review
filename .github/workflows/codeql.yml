# CodeQL is free on public repositories only — this workflow becomes active
# the day the repo visibility flips to public (Settings > Change visibility).
name: CodeQL
# Actions pinned to a full commit SHA (tag in the comment), like the other
# workflows: a tag is a mutable pointer.
on:
  workflow_call:
  schedule: [{ cron: '0 4 1 * *' }]
jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
