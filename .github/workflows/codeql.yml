# CodeQL is free on public repositories only — this workflow becomes active
# the day the repo visibility flips to public (Settings > Change visibility).
name: CodeQL
# Actions pinned to a full commit SHA (tag in the comment), like the other
# workflows: a tag is a mutable pointer.
on:
  workflow_call:
  schedule: [{ cron: '0 4 1 * *' }]
jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
