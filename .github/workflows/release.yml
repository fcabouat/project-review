name: Release
# Called only after CI (and Pages on main). Never run privileged PR code.
on:
  workflow_call:
permissions: { contents: read }
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compute the release with Changesets
        run: pnpm changeset status --output "$RUNNER_TEMP/changeset-plan.json"
      - name: Read the version computed by Changesets
        id: plan
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const plan = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/changeset-plan.json`, 'utf8'));
          const versions = [...new Set(plan.releases.filter(p => p.type !== 'none').map(p => p.newVersion))];
          if (versions.length > 1 || (versions.length && !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(versions[0]))) throw new Error('Expected one stable Changesets version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${versions[0] ?? ''}\n`);
          JS
      - name: Freeze active release branches instead of updating them from develop
        if: steps.plan.outputs.version != ''
        id: candidate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        with:
          script: |
            const repo = context.repo;
            const tip = await github.rest.git.getRef({...repo, ref: 'heads/develop'});
            if (tip.data.object.sha !== context.sha) return core.notice('Superseded develop run.');
            const version = process.env.VERSION;
            const branch = `release/${version}`;
            const open = await github.paginate(github.rest.pulls.list, {...repo, state: 'open', per_page: 100});
            const active = open.find(p => p.head.repo?.full_name === `${repo.owner}/${repo.repo}` && /^(release|hotfix)\//.test(p.head.ref));
            if (active) return core.notice(`Finish the active delivery first: ${active.html_url}`);
            try {
              await github.rest.git.getRef({...repo, ref: `tags/v${version}`});
              throw new Error(`v${version} already exists: merge the published delivery back into develop first.`);
            } catch (error) { if (error.status !== 404) throw error; }
            try {
              await github.rest.git.getRef({...repo, ref: `heads/${branch}`});
              throw new Error(`${branch} already exists without an open PR. Review it and open its PR to main; it will not be overwritten.`);
            } catch (error) { if (error.status !== 404) throw error; }
            core.setOutput('create', 'true');
      - name: Cut the release from the verified develop commit
        if: steps.candidate.outputs.create == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git switch -c "release/$VERSION"
          pnpm changeset version
          git add .changeset app/package.json app/CHANGELOG.md packages/*/package.json packages/*/CHANGELOG.md pnpm-lock.yaml
          git commit -m "chore: prepare release $VERSION with Changesets"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/release/$VERSION"
          gh pr create --base main --head "release/$VERSION" --title "release: v$VERSION" \
            --body 'Frozen from develop; versions and changelogs generated by Changesets. Approve the workflows if requested. Stabilize this release branch, then use **Create a merge commit**. After publication, merge its backport PR to develop before deleting the release branch.'

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write, pull-requests: write }
    steps:
      # API-only: no checkout, package installation or repository code execution
      # in the job that can create tags and releases.
      - name: Publish the validated main commit (never replace a tag)
        id: published
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const repo = context.repo;
            const tip = await github.rest.git.getRef({...repo, ref: 'heads/main'});
            if (tip.data.object.sha !== context.sha) throw new Error('main has moved; let its newer CI publish.');
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({...repo, commit_sha: context.sha});
            const pr = prs.data.find(p => p.merged_at && p.merge_commit_sha === context.sha && p.base.ref === 'main' &&
              p.head.repo?.full_name === `${repo.owner}/${repo.repo}` && /^(release|hotfix)\//.test(p.head.ref));
            const commit = await github.rest.repos.getCommit({...repo, ref: context.sha});
            if (!pr || commit.data.parents.length !== 2 || commit.data.parents[1].sha !== pr.head.sha) {
              throw new Error('Only a classic merge from a delivery PR may publish.');
            }
            const read = async path => {
              const file = await github.rest.repos.getContent({...repo, path, ref: context.sha});
              return Buffer.from(file.data.content, 'base64').toString();
            };
            const manifests = await Promise.all(['app', 'packages/core', 'packages/components', 'packages/infrastructure']
              .map(async path => JSON.parse(await read(`${path}/package.json`))));
            const version = manifests[0].version;
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) ||
                manifests.some(p => p.version !== version || p.private !== true)) throw new Error('Inconsistent private package versions');
            if (![`release/${version}`, `hotfix/${version}`].includes(pr.head.ref)) throw new Error('Branch/version mismatch');
            core.setOutput('branch', pr.head.ref);
            core.setOutput('head', pr.head.sha);
            const changesets = await github.rest.repos.getContent({...repo, path: '.changeset', ref: context.sha});
            if (changesets.data.some(f => f.name.endsWith('.md') && f.name !== 'README.md')) throw new Error('Unconsumed changesets on main');
            const notes = (await read('app/CHANGELOG.md')).split(`\n## ${version}\n`)[1]?.split('\n## ')[0]?.trim();
            if (!notes) throw new Error('Missing changelog for this version');
            const tag = `v${version}`;
            let tagged;
            let tagExists = false;
            try {
              await github.rest.git.getRef({...repo, ref: `tags/${tag}`});
              tagExists = true;
            }
            catch (error) { if (error.status !== 404) throw error; }
            // getCommit returns 422 for a missing ref, not 404. Check existence
            // first; resolving here also peels annotated tags to their commit.
            if (tagExists) tagged = (await github.rest.repos.getCommit({...repo, ref: `refs/tags/${tag}`})).data.sha;
            if (tagged && tagged !== context.sha) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({...repo, basehead: `${tagged}...${context.sha}`});
              if (!['ahead', 'identical'].includes(comparison.data.status)) throw new Error('Tag conflicts with main');
              const release = await github.rest.repos.getReleaseByTag({...repo, tag});
              if (release.data.draft) throw new Error('Review the existing draft release manually');
              return core.notice(`${tag} was already published; no changes made.`);
            }
            if (!tagged) await github.rest.git.createRef({...repo, ref: `refs/tags/${tag}`, sha: context.sha});
            try {
              const release = await github.rest.repos.getReleaseByTag({...repo, tag});
              if (release.data.draft) throw new Error('Review the existing draft release manually');
              return core.notice(release.data.html_url);
            } catch (error) { if (error.status !== 404) throw error; }
            const release = await github.rest.repos.createRelease({...repo, tag_name: tag,
              target_commitish: context.sha, name: tag, body: notes, draft: false, prerelease: false});
            core.notice(release.data.html_url);
      - name: Merge the published delivery branch back into develop
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DELIVERY_BRANCH: ${{ steps.published.outputs.branch }}
          DELIVERY_HEAD: ${{ steps.published.outputs.head }}
        with:
          script: |
            const repo = context.repo;
            const branch = process.env.DELIVERY_BRANCH;
            const sha = process.env.DELIVERY_HEAD;
            const comparison = await github.rest.repos.compareCommitsWithBasehead({...repo, basehead: `develop...${sha}`});
            if (!comparison.data.ahead_by) return;
            // GitHub may auto-delete the head after the main merge. Restore only
            // that exact published commit for the second Gitflow merge.
            try {
              const ref = await github.rest.git.getRef({...repo, ref: `heads/${branch}`});
              if (ref.data.object.sha !== sha) throw new Error('Delivery branch changed after publication; review it before backporting.');
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...repo, ref: `refs/heads/${branch}`, sha});
            }
            const prs = await github.rest.pulls.list({...repo, state: 'open', base: 'develop', head: `${repo.owner}:${branch}`});
            if (prs.data.length) return core.notice(prs.data[0].html_url);
            const pr = await github.rest.pulls.create({...repo, base: 'develop', head: branch,
              title: `chore: merge ${branch} back into develop`, body: 'Published on main. Complete Gitflow with **Create a merge commit**, then delete this delivery branch. This brings the versions, changelogs and stabilization fixes back to develop.'});
            core.notice(pr.data.html_url);
